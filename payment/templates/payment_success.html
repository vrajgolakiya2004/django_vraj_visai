{% block content %}
{% include 'header.html' %}
{% include 'sidebar.html' %}

<div class="techwave_fn_content">
    <div class="techwave_fn_page">
        <div class="container">
            <div class="techwave_fn_title_holder">
                <h1 class="title">Payment Successful!</h1>
                <p class="desc">Thank you for purchasing <strong>{{ plan_name }}</strong> plan.</p>
                {% if customer_email %}
                <p>A receipt has been sent to <strong>{{ customer_email }}</strong>.</p>
                {% endif %}
            </div>
            
            <div class="techwave_fn_button_group">
                <a href="{% url 'payment:pricingPage' %}" class="techwave_fn_button"><span>Go to Dashboard</span></a>
            </div>
        </div>
    </div>
</div>

{% include 'footer.html' %}
{% endblock %}
