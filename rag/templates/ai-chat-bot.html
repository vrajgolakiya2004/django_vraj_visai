<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Bot - TechWave</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>

         
        


        /* Light/Dark Mode Base Styles */
        [data-techwave-skin="light"] .chat__navigation {
            background-color: #f9f9f9;
            color: #000;
        }

        [data-techwave-skin="dark"] .chat__navigation {
            background-color: #0f0e11;
            color: #fff;
        }

        [data-techwave-skin="dark"] .chat__navigation .btn {
            background-color: #2e2e2e;
            color: #fff;
            border: none;
        }

        [data-techwave-skin="light"] .chat__navigation .btn {
            background-color: #fff;
            color: #000;
            border: 1px solid #ccc;
        }

        /* Chat Interface Styles */
        .chat__page {
            position: relative;
            height: calc(100vh - 120px);
            display: flex;
            flex-direction: column;
        }

        .chat__list {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
        }

        .chat__item {
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .chat__box {
            padding: 5px 5px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
           }

        .your__chat {
            background-color: #e3f2fd;
            margin-left: auto;
        }

        .bot__chat {
            background-color: #f1f1f1;
            margin-right: auto;
        }

        .author {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
             }

        /* Typing Indicator */
        .typing-indicator .typing {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 20px;
        }

        .typing-indicator .typing i {
            font-size: 12px;
            color:rgb(172, 113, 196);
            opacity: 0.4;
        }

        .typing-indicator .typing i:nth-child(1) {
            animation: typingAnimation 1s infinite;
        }

        .typing-indicator .typing i:nth-child(2) {
            animation: typingAnimation 1s infinite 0.2s;
        }

        .typing-indicator .typing i:nth-child(3) {
            animation: typingAnimation 1s infinite 0.4s;
        }

        @keyframes typingAnimation {
            0% { opacity: 0.4; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-5px); }
            100% { opacity: 0.4; transform: translateY(0); }
        }

        /* Input Area */
        .chat__comment {
            padding: 15px 0;
            border-top: 1px solid #eee;
            background-color: #17151b;
        }

        .fn__chat_comment {
            position: relative;
        }

        .fn__chat_comment textarea {
            width: 100%;
            padding: 12px 50px 12px 15px;
            border-radius: 24px;
            border: 1px solid #ddd;
            resize: none;
            outline: none;
            transition: all 0.3s;
        }

        .fn__chat_comment textarea:focus {
            border-color:rgb(186, 124, 214);
            box-shadow: 0 0 0 3px rgba(74, 139, 252, 0.2);
        }

        .fn__chat_comment button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
        }

        /* History Sidebar Styles */
        #history-sidebar {
            position: fixed;
            top: 0;
            left: -340px;
            width: 320px;
            height: 100%;
            background: var(--sidebar-bg, #f8f9fa);
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        #history-sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 15px 20px;
            background: var(--sidebar-header-bg, #ffffff);
            border-bottom: 1px solid var(--sidebar-border, #e9ecef);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header span {
            font-weight: 600;
            font-size: 1.1rem;
        }

        #close-sidebar {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--sidebar-close-color, #6c757d);
        }

        #history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .session-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
            border-bottom: 1px solid var(--sidebar-border, #e9ecef);
        }

        .session-item:hover {
            background-color: var(--sidebar-item-hover, #e9ecef);
        }

        .session-item.active {
            background-color: var(--sidebar-item-active, #e7f1ff);
        }

        .session-content {
            display: flex;
            flex-direction: column;
        }

        .session-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 10px;
            font-weight: 500;
        }

        .session-date {
            font-size: 0.75rem;
            color: var(--sidebar-date-color, #6c757d);
            margin-top: 2px;
        }

        .session-actions {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .session-item:hover .session-actions {
            opacity: 1;
        }

        .session-actions button {
            background: none;
            border: none;
            padding: 5px;
            cursor: pointer;
            color: var(--sidebar-action-color, #6c757d);
            font-size: 0.9rem;
        }

        .session-actions button:hover {
            color: var(--sidebar-action-hover, #495057);
        }

        #sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #sidebar-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        /* Navigation Buttons */
        .chat__navigation {
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .history-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color:rgb(222, 74, 252);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .history-button:hover {
            background-color: #3a7ae3;
            transform: scale(1.05);
        }

        .history-button i {
            color: white;
            font-size: 1.2rem;
        }

        .new-chat-button {
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 20px;
            transition: all 0.3s;
        }

        /* Dark mode support */
        [data-techwave-skin="dark"] {
            --sidebar-bg: #2d3748;
            --sidebar-header-bg: #1a202c;
            --sidebar-border: #4a5568;
            --sidebar-close-color: #a0aec0;
            --sidebar-item-hover: #4a5568;
            --sidebar-item-active: #2c5282;
            --sidebar-action-color: #a0aec0;
            --sidebar-action-hover: #ffffff;
            --sidebar-date-color: #a0aec0;
        }

        [data-techwave-skin="dark"] .your__chat {
            background:linear-gradient(270deg, var(--techwave-main-color1), var(--techwave-main-color2), var(--techwave-main-color1), var(--techwave-main-color2)) border-box;
            color: white;
        }

        [data-techwave-skin="dark"] .bot__chat {
            background-color: #374151;
            color: white;
        }

        [data-techwave-skin="dark"] .chat__comment {
            background-color: #1f2937;
            border-top-color: #374151;
        }

        [data-techwave-skin="dark"] .fn__chat_comment textarea {
            background-color: #374151;
            border-color: #4b5563;
            color: white;
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            #history-sidebar {
                width: 280px;
            }
            
            .chat__box {
                max-width: 90%;
            }
        }

        @media (max-width: 576px) {
            #history-sidebar {
                width: 85vw;
            }
            
            .chat__navigation .container {
                padding: 0 15px;
            }
            
            .history-button {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
{% block content %}
{% include 'header.html' %}
{% include 'sidebar.html' %}

<!-- CONTENT -->
<div class="techwave_fn_content">
    <!-- PAGE -->
    <div class="techwave_fn_page">
        <!-- AI Chat Bot Page -->
        <section class="techwave_fn_aichatbot_page fn__chatbot">
            <div class="chat__page d-flex flex-column h-100">

                <!-- Title Holder -->
                <header class="fn__title_holder"></header>

                <!-- Navigation -->
                <nav class="chat__navigation py-2">
                    <div class="container d-flex align-items-center gap-2">
                        <button class="btn history-button" id="historyBtn" title="View Chat History" aria-label="View Chat History">
                            <i class="bi bi-clock-history"></i>
                        </button>
                        <button class="btn new-chat-button" id="newChatBtn" aria-label="Start New Chat">
                            New Chat
                        </button>
                    </div>
                </nav>

                <!-- Chat Messages / Welcome Screen -->
                <main class="container flex-grow-1 d-flex flex-column py-3">
                    
                    <!-- Welcome Screen -->
                    <div class="welcome-screen text-center my-auto" id="welcomeScreen">
                        <h2 class="mb-2 text-light">Welcome to AI Assistant</h2>
                        <p class="text-light">Start a new conversation by typing your message below.</p>
                    </div>

                    <!-- Chat List -->
                    <div class="chat__list d-none" id="chatBox" role="log" aria-live="polite"></div>
                </main>

                <!-- Input Area -->
                <footer class="chat__comment py-2">
                    <div class="container">
                        <div class="fn__chat_comment d-flex flex-column">
                            <div class="new__chat text-center mb-2">
                                <p class="text-muted">Ask questions or start a conversation</p>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <textarea id="userInput" rows="1" placeholder="Type your message here..." aria-label="Type your message"></textarea>
                                <button id="sendBtn" aria-label="Send Message">
                                    <img src="{% static "assets/svg/enter.svg" %}" alt="Send" class="fn__svg">
                                </button>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>

            <!-- History Sidebar -->
            <aside id="history-sidebar" class="history-sidebar" aria-hidden="true" role="complementary">
                <div class="sidebar-header d-flex justify-content-between align-items-center">
                    <span>Chat History</span>
                    <button id="close-sidebar" aria-label="Close Sidebar">×</button>
                </div>
                <div id="history-list" class="history-list"></div>
            </aside>

            <!-- Sidebar Overlay -->
            <div id="sidebar-overlay" aria-hidden="true"></div>
        </section>
        <!-- !AI Chat Bot Page -->
    </div>
    <!-- !PAGE -->
</div>

<!-- !CONTENT -->

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Configuration
    const sessionId = "{{ session_id }}";
    const chatTitle = "{{ chat_title }}";
    const csrfToken = "{{ csrf_token }}";
    let currentSessionId = sessionId;

    // DOM Elements
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const historyBtn = document.getElementById('historyBtn');
    const historySidebar = document.getElementById('history-sidebar');
    const closeSidebarBtn = document.getElementById('close-sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const historyList = document.getElementById('history-list');
    const welcomeScreen = document.getElementById("welcomeScreen");

    // Utility Functions
    function scrollToBottom(smooth = true) {
        chatBox.scrollTo({
            top: chatBox.scrollHeight,
            behavior: smooth ? 'smooth' : 'auto'
        });
    }

    function showTypingIndicator() {
        const typingIndicator = document.createElement('div');
        typingIndicator.className = 'chat__item active typing-indicator';
        typingIndicator.innerHTML = `
            <div class="chat__box bot__chat">
                <div class="author"><span>AI Assistant</span></div>
                <div class="chat">
                    <div class="typing">
                        <i class="bi bi-dot"></i>
                        <i class="bi bi-dot"></i>
                        <i class="bi bi-dot"></i>
                    </div>
                </div>
            </div>
        `;
        chatBox.appendChild(typingIndicator);
        scrollToBottom();
        return typingIndicator;
    }

    function removeTypingIndicator(indicator) {
        if (indicator && indicator.parentNode) {
            indicator.parentNode.removeChild(indicator);
        }
    }

    function appendMessage(type, author, message) {
        const chatItem = document.createElement('div');
        chatItem.className = 'chat__item active';
        chatItem.innerHTML = `
            <div class="chat__box ${type}">
                <div class="author"><span>${author}</span></div>
                <div class="chat"><p>${message}</p></div>
            </div>
        `;
        chatBox.appendChild(chatItem);
        scrollToBottom();
    }

    function formatDate(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        return date.toLocaleString('en-US', {
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    // History Sidebar Functions
    function toggleHistorySidebar() {
        const isOpen = historySidebar.classList.toggle('open');
        sidebarOverlay.classList.toggle('active', isOpen);
        historySidebar.setAttribute('aria-hidden', !isOpen);
        
        if (isOpen) {
            loadSessions();
        }
    }

    function loadSessions() {
        console.log('Fetching chat history from:', "{% url 'chat_history' %}");
        fetch("{% url 'chat_history' %}")
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! Status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    renderSessions(data.sessions);
                } else {
                    console.error('Error loading sessions:', data.message);
                    historyList.innerHTML = '<div class="text-center py-3 text-muted">Failed to load chat history</div>';
                }
            })
            .catch(error => {
                console.error('Error loading sessions:', error);
                historyList.innerHTML = '<div class="text-center py-3 text-muted">Failed to load chat history</div>';
            });
    }

    function renderSessions(sessions) {
        historyList.innerHTML = '';
        
        if (!sessions || sessions.length === 0) {
            historyList.innerHTML = '<div class="text-center py-3 text-muted">No chat history yet</div>';
            return;
        }
        
        sessions.forEach(session => {
            const sessionElement = document.createElement('div');
            sessionElement.className = `session-item ${session.chat_session_id === currentSessionId ? 'active' : ''}`;
            sessionElement.innerHTML = `
                <div class="session-content">
                    <span class="session-title">${session.chat_title || 'Untitled Chat'}</span>
                    <div class="session-date">${formatDate(session.created_at)}</div>
                    <div class="session-actions">
                        <button class="btn-rename" title="Rename">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn-delete" title="Delete">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            `;
            
            // Click handler for loading session
            sessionElement.querySelector('.session-content').addEventListener('click', (e) => {
                if (!e.target.closest('.session-actions')) {
                    loadChatHistory(session.chat_session_id);
                    toggleHistorySidebar();
                }
            });
            
            // Rename button handler
            sessionElement.querySelector('.btn-rename').addEventListener('click', (e) => {
                e.stopPropagation();
                renameSession(session.chat_session_id, sessionElement.querySelector('.session-title'));
            });
            
            // Delete button handler
            sessionElement.querySelector('.btn-delete').addEventListener('click', (e) => {
                e.stopPropagation();
                deleteSession(session.chat_session_id);
            });
            
            historyList.appendChild(sessionElement);
        });
    }

function renameSession(sessionId, titleElement) {
    const currentTitle = titleElement.textContent;

    // Create modal overlay
    const overlay = document.createElement('div');
    overlay.className = 'rename-dialog-overlay';

    // Create modal dialog
    const dialog = document.createElement('div');
    dialog.className = 'rename-dialog';
    dialog.innerHTML = `
        <h3>Rename Chat</h3>
        <input type="text" value="${currentTitle}" placeholder="Enter new chat title">
        <div class="dialog-buttons">
            <button class="cancel-btn">Cancel</button>
            <button class="confirm-btn">Confirm</button>
        </div>
    `;

    // Append modal and overlay to body
    document.body.appendChild(overlay);
    document.body.appendChild(dialog);

    // Show modal
    setTimeout(() => {
        overlay.classList.add('active');
        dialog.classList.add('open');
    }, 10);

    // Get input and buttons
    const input = dialog.querySelector('input');
    const confirmBtn = dialog.querySelector('.confirm-btn');
    const cancelBtn = dialog.querySelector('.cancel-btn');

    // Close modal function
    const closeModal = () => {
        overlay.classList.remove('active');
        dialog.classList.remove('open');
        setTimeout(() => {
            overlay.remove();
            dialog.remove();
        }, 300); // Match CSS transition duration
    };

    // Confirm button handler
    confirmBtn.addEventListener('click', () => {
        const newTitle = input.value.trim();
        if (newTitle && newTitle !== currentTitle) {
            console.log(`Renaming session ${sessionId} to: ${newTitle}`);
            fetch(`/rag/chat/rename-session/${sessionId}/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ title: newTitle })
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP error! Status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    titleElement.textContent = newTitle;
                    if (sessionId === currentSessionId) {
                        newChatBtn.textContent = newTitle;
                    }
                } else {
                    console.error('Error renaming session:', data.message);
                    alert('Failed to rename session: ' + data.message);
                }
                closeModal();
            })
            .catch(error => {
                console.error('Error renaming session:', error);
                alert('Failed to rename session');
                closeModal();
            });
        } else {
            closeModal();
        }
    });

    // Cancel button handler
    cancelBtn.addEventListener('click', closeModal);

    // Overlay click handler
    overlay.addEventListener('click', closeModal);

    // Handle Enter key
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            confirmBtn.click();
        }
    });

    // Focus input
    input.focus();
}

   function deleteSession(sessionId) {
    // Create modal overlay
    const overlay = document.createElement('div');
    overlay.className = 'delete-dialog-overlay';

    // Create modal dialog
    const dialog = document.createElement('div');
    dialog.className = 'delete-dialog';
    dialog.innerHTML = `
        <h3>Delete Chat</h3>
        <p>Are you sure you want to delete this chat? This action cannot be undone.</p>
        <div class="dialog-buttons">
            <button class="cancel-btn">Cancel</button>
            <button class="confirm-btn">Delete</button>
        </div>
    `;

    // Append modal and overlay to body
    document.body.appendChild(overlay);
    document.body.appendChild(dialog);

    // Show modal
    setTimeout(() => {
        overlay.classList.add('active');
        dialog.classList.add('open');
    }, 10);

    // Get buttons
    const confirmBtn = dialog.querySelector('.confirm-btn');
    const cancelBtn = dialog.querySelector('.cancel-btn');

    // Close modal function
    const closeModal = () => {
        overlay.classList.remove('active');
        dialog.classList.remove('open');
        setTimeout(() => {
            overlay.remove();
            dialog.remove();
        }, 300); // Match CSS transition duration
    };

    // Confirm button handler
    confirmBtn.addEventListener('click', () => {
        console.log(`Deleting session: ${sessionId}`);
        fetch(`/rag/chat/delete-session/${sessionId}/`, {
            method: 'DELETE',
            headers: {
                'X-CSRFToken': csrfToken
            }
        })
        .then(res => {
            if (!res.ok) {
                throw new Error(`HTTP error! Status: ${res.status}`);
            }
            return res.json();
        })
        .then(data => {
            if (data.status === 'success') {
                if (sessionId === currentSessionId) {
                    chatBox.innerHTML = '';
                    currentSessionId = null;
                    newChatBtn.textContent = 'New Chat';
                }
                loadSessions();
            } else {
                console.error('Error deleting session:', data.message);
                alert('Failed to delete session: ' + data.message);
            }
            closeModal();
        })
        .catch(error => {
            console.error('Error deleting session:', error);
            alert('Failed to delete session');
            closeModal();
        });
    });

    // Cancel button handler
    cancelBtn.addEventListener('click', closeModal);

    // Overlay click handler
    overlay.addEventListener('click', closeModal);
}


    function loadChatHistory(sessionId) {
        if (!sessionId) {
            console.error('No session ID provided, starting new session');
            startNewSession();
            return;
        }
        
        console.log(`Loading chat history for session: ${sessionId}`);
        fetch(`/rag/chat/history/${sessionId}/`)
            .then(res => {
                if (!res.ok) {
                    return res.text().then(text => {
                        console.error('Response text:', text);
                        throw new Error(`HTTP error! Status: ${res.status}`);
                    });
                }
                return res.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    currentSessionId = sessionId;
                    chatBox.innerHTML = '';
                    
                    if (data.chat_title) {
             newChatBtn.textContent = 'New Chat';

                    }
                    
                    if (data.chats && data.chats.length > 0) {
                        data.chats.forEach(chat => {
                            appendMessage('your__chat', 'You', chat.user_message);
                            appendMessage('bot__chat', 'AI Assistant', chat.bot_response);
                        });
                    } else {
                        
                    }   
                    
                    scrollToBottom(false);
                } else {
                    console.error('Error in response:', data.message);
                    chatBox.innerHTML = '<div class="text-center py-3 text-muted">Failed to load chat history</div>';
                    startNewSession(); // Fallback to new session
                }
            })
            .catch(error => {
                console.error('Error loading chat history:', error);
                chatBox.innerHTML = '<div class="text-center py-3 text-muted">Failed to load chat history</div>';
                startNewSession(); // Fallback to new session
            });
    }

   function startNewSession() {
    if (!csrfToken) {
        console.error('csrfToken is undefined');
        alert('Error: CSRF token not found');
        return;
    }

    console.log('Starting new session');
    fetch('/rag/chat/new-session/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
        }
    })
    .then(res => {
        console.log('Fetch response status:', res.status);
        if (!res.ok) {
            throw new Error(`HTTP error! Status: ${res.status}`);
        }
        return res.json();
    })
    .then(data => {
        console.log('Fetch response data:', data);
        if (data.status === 'success') {
            currentSessionId = data.session_id;
            newChatBtn.textContent = 'New Chat';
            chatBox.innerHTML = '';
            loadSessions();
            console.log(`New session created: ${data.session_id}`);
        } else {
            console.error('Error creating session:', data.message);
            alert('Failed to create new session: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error creating new session:', error);
        alert('Failed to create new session: ' + error.message);
    });
}

function appendMessage(type, author, text) {
    // Hide welcome screen if visible
    if (welcomeScreen && !welcomeScreen.classList.contains("d-none")) {
        welcomeScreen.classList.add("d-none");
        chatBox.classList.remove("d-none");
    }

    const chatItem = document.createElement("div");
    chatItem.className = "chat__item active";

    if (type === "your__chat") {
        chatItem.innerHTML = `
            <div class="chat__box your__chat">
                <div class="author"><span>${author}</span></div>
                <div class="chat"><p>${text}</p></div>
            </div>
        `;
    } else {
        chatItem.innerHTML = `
            <div class="chat__box bot__chat">
                <div class="author"><span>${author}</span></div>
                <div class="chat"><p>${text}</p></div>
            </div>
        `;
    }

    chatBox.appendChild(chatItem);
    chatBox.scrollTop = chatBox.scrollHeight;
}


    // Event Listeners
   sendBtn.addEventListener("click", async () => {
    const message = userInput.value.trim();
    if (!message) return;

    if (!currentSessionId) {
        await startNewSession();
    }

    // Disable input while sending
    userInput.disabled = true;
    sendBtn.disabled = true;

    appendMessage("your__chat", "You", message);
    userInput.value = "";

    const typingIndicator = showTypingIndicator();

    try {
        console.log(`Sending message for session: ${currentSessionId}`);
        const response = await fetch("{% url 'chat_api' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken,
            },
            body: JSON.stringify({
                message,
                session_id: currentSessionId,
                chat_title: newChatBtn.textContent,
            }),
        });

        const data = await response.json();
        removeTypingIndicator(typingIndicator);

        if (data.status === "success") {
            appendMessage("bot__chat", "AI Assistant", data.response);
        } else {
            appendMessage("bot__chat", "AI Assistant", "Error: Failed to get response");
        }
    } catch (error) {
        console.error("Error sending message:", error);
        removeTypingIndicator(typingIndicator);
        appendMessage("bot__chat", "AI Assistant", "Error: Failed to get response");
    } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
    }
});
newChatBtn.addEventListener("click", async (e) => {
    e.preventDefault();
    console.log("New Chat button clicked, chatBox children:", chatBox.children.length);

    if (!chatBox) {
        console.error("chatBox is undefined");
        alert("Error: Chat box not found");
        return;
    }

    // Case 1: If chat is already blank → no need to start new session
    if (chatBox.children.length === 0) {
        console.log("Chat is already empty, showing welcome screen.");
        if (welcomeScreen) {
            welcomeScreen.classList.remove("d-none");
        }
        chatBox.classList.add("d-none");
        return;
    }

    // Case 2: Chat has messages → clear and reset
    console.log("Clearing chat and starting a new session...");
    await startNewSession(); // clear old session on backend

    // Clear old messages
    chatBox.innerHTML = "";

    // Show welcome screen again
    if (welcomeScreen) {
        welcomeScreen.classList.remove("d-none");
    }
    chatBox.classList.add("d-none");
});
